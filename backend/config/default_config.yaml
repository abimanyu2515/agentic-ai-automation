workflow:
  mode: sequential          # sequential | supervisor
  human_review_enabled: true
  evaluation_threshold: 0.75

agents:
  requirement: true
  scenario: true
  testcase: true
  evaluation: true
  human_approval: true
  playwright: false
  execution: false
  report: false

llm:
  provider: openai          # openai | anthropic | ollama | groq
  model: gpt-4o-mini
  temperature: 1.0

browser:
  type: chromium            # chromium | firefox | webkit
  headless: true

rag:
  enabled: false
  vector_db_provider: ragflow
  vector_db_path: ./data/vector_store
  ragflow_api_base: http://localhost:9380
  ragflow_api_key: ~
  # Per project knowledge base (spec 0006). RAG_* env vars override these.
  storage_root: data/projects
  upload_max_mb: 20
  upload_types: [pdf, docx, txt, md, csv, xlsx]
  parse_poll_seconds: 5
  parse_timeout_seconds: 600
  index_retry_delays: [10, 60, 300]
  # Minutes between replays of pending RAGFlow deletes (spec 0007).
  delete_resweep_minutes: 30
  # Graded retrieval stage in the workflow (spec 0006). Off until the eval shows good recall.
  workflow_retrieval_enabled: false
  top_k: 8
  max_retrieval_attempts: 2
  min_relevant_chunks: 2
  # Retrieval LLM role pool; RETRIEVAL_LLM_* env vars override these.
  retrieval_llm_max_concurrent: 2
  retrieval_llm_cooldown_seconds: 30
  retrieval_llm_max_wait_seconds: 20

generation:
  scenario_count: 3

evaluation:
  duplicate_similarity_threshold: 0.75
  relevance_rejection_threshold: 0.3

playwright:
  # No default target application. Set per project via target_url
  # (Project Settings UI or PUT /api/v1/projects/{id}).
  base_url: ""
  browser: chromium
  headless: true
  timeout: 60
  retries: 0
  workspace_url: http://localhost:3000

repository:
  provider: json           # json | postgres
  database_url: postgresql+psycopg2://postgres:postgres@localhost:5432/agentic_ai
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30

object_repository:
  max_prompt_elements: 150
  locator_timeout_ms: 3000
  scan_status_ttl_seconds: 3600
  harvest_enabled: true
  harvest_max_pages: 20
  harvest_page_budget_ms: 5000
  healing:
    # Self healing locators (spec 0011). Each project can also switch it off.
    enabled: true
    auto_apply_threshold: 0.85
    suggest_threshold: 0.5
    min_margin: 0.15
    llm_enabled: true            # uses the analysis LLM role
    max_attempts_per_run: 1
    max_candidates_for_llm: 5
    script_repair:
      # Repair the script from the log analyser's RCA (spec 0011, AC-18 to AC-21).
      enabled: true
      min_rca_confidence: 0.6    # only "Flaky Test / Automation Issue" at or above this
      max_attempts: 1

chat:
  # Chat assistant (spec 0005). CHAT_* env vars override these.
  enabled: true
  history_messages: 20
  history_chars: 24000
  max_tool_steps: 6
  tool_result_chars: 4000
  guide_chars: 8000
  max_streams: 10
  rate_limit_per_minute: 20
  retention_days: 90
  llm_max_concurrent: 4
  llm_cooldown_seconds: 60
  llm_max_wait_seconds: 30

token_usage:
  enabled: true              # record every LLM completion for the Token Utilization page
  monthly_budget_usd: 0      # 0 = no budget; editable from the Token Utilization page
  alert_threshold_pct: 80
  # USD per 1M tokens. Overrides litellm's price map; use it for models litellm does not price.
  # Keys: the model name (gemini-2.5-flash) or the litellm model string (gemini/gemini-2.5-flash).
  pricing_overrides: {}
