workflow:
  mode: sequential          # sequential | supervisor
  human_review_enabled: true
  evaluation_threshold: 0.75

agents:
  requirement: true
  scenario: true
  testcase: true
  evaluation: true
  human_approval: true
  playwright: false
  execution: false
  report: false

llm:
  provider: openai          # openai | anthropic | ollama | groq
  model: gpt-4o-mini
  temperature: 1.0

browser:
  type: chromium            # chromium | firefox | webkit
  headless: true

rag:
  enabled: false
  vector_db_provider: chroma
  vector_db_path: ./data/vector_store
  ragflow_api_base: http://localhost:9380
  ragflow_api_key: ~
  ragflow_dataset_id: ~

generation:
  scenario_count: 3

evaluation:
  duplicate_similarity_threshold: 0.75
  relevance_rejection_threshold: 0.3

playwright:
  # No default target application. Set per project via target_url
  # (Project Settings UI or PUT /api/v1/projects/{id}).
  base_url: ""
  browser: chromium
  headless: true
  timeout: 60
  retries: 0
  workspace_url: http://localhost:3000

repository:
  provider: json           # json | postgres
  database_url: postgresql+psycopg2://postgres:postgres@localhost:5432/agentic_ai
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30

object_repository:
  max_prompt_elements: 150
  locator_timeout_ms: 3000
  scan_status_ttl_seconds: 3600
  harvest_enabled: true
  harvest_max_pages: 20
  harvest_page_budget_ms: 5000
